services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gotalk-backend
    ports:
      - "8080:8080"
    volumes:
      # Persist SQLite database
      - ./data:/app/data
    environment:
      - DB_PATH=/app/data/forum.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gotalk-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  gotalk-data:
